services:
  backend:
    build: ./backend
    environment:
      DOWNLOAD_DIR: /data/downloads
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-30}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-7200}
      MAX_FILESIZE_MB: ${MAX_FILESIZE_MB:-4096}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-50}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT: ${RATE_LIMIT:-10/minute}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  downloads:
